<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demostración Pymup API</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #ffffff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 480px; }
    h2 { margin-top: 0; color: #1e293b; text-align: center; }
    label { font-size: 0.9rem; font-weight: 600; color: #475569; display: block; margin-bottom: 0.5rem; }
    textarea { width: 100%; height: 100px; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px; resize: vertical; font-size: 1rem; margin-bottom: 1rem; }
    textarea:focus { outline: none; border-color: #2563eb; }
    button { width: 100%; background-color: #2563eb; color: white; border: none; padding: 0.75rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }
    .result-box { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; background-color: #f8fafc; border: 1px solid #e2e8f0; display: none; }
    .result-title { font-size: 0.85rem; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 0.5rem; }
    .result-content p { margin: 0.5rem 0; color: #0f172a; }
    .error-text { color: #dc2626; font-weight: 600; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Demostración Pymup API</h2>
    <form id="predictForm">
      <label for="inputText">Escribe un texto para diagnosticar:</label>
      <textarea id="inputText" placeholder="Ingresa los datos aquí..." required></textarea>
      <button type="submit" id="submitBtn">Probar Modelo</button>
    </form>

    <div id="resultBox" class="result-box">
      <div class="result-title">Respuesta del Modelo:</div>
      <div id="resultContent" class="result-content"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('predictForm');
    const submitBtn = document.getElementById('submitBtn');
    const resultBox = document.getElementById('resultBox');
    const resultContent = document.getElementById('resultContent');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const texto = document.getElementById('inputText').value;
      const urlAPI = "https://pymup-api-1.onrender.com/diagnosticar";

      submitBtn.disabled = true;
      submitBtn.textContent = "Despertando servidor en Render...";
      resultBox.style.display = "block";
      resultContent.innerHTML = "<p>Conectando... Si el servidor estaba dormido, esto tomará unos 60 segundos.</p>";

      // Configuración de Controller para cancelar si supera 90s
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 90000);

      try {
        const response = await fetch(urlAPI, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ texto: texto }),
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || `Error del servidor HTTP ${response.status}`);
        }

        const resultado = await response.json();
        
        resultContent.innerHTML = `
          <p><strong>Categoría:</strong> ${resultado.categoria}</p>
          <p><strong>Confianza:</strong> ${resultado.confianza}%</p>
        `;

      } catch (error) {
        clearTimeout(timeoutId);
        if (error.name === 'AbortError') {
          resultContent.innerHTML = `<p class="error-text">El servidor tardó demasiado en responder (Timeout). Revisa en Render si la app crasheó.</p>`;
        } else {
          resultContent.innerHTML = `<p class="error-text">Fallo de conexión/CORS: ${error.message}</p>`;
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Probar Modelo";
      }
    });
  </script>

</body>
</html>
